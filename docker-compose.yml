services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    environment:
      IMPACTPILOT_CONFIG_DIR: /app/config
      IMPACTPILOT_DB_URL: sqlite:////app/data/impactpilot.db
      IMPACTPILOT_CORS: "*"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
